name: Build ImmortalWrt - Orange Pi Zero3 1.5GB

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '清理缓存重新编译'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
      - 'bugfix/**'
      - 'feature/**'
    paths:
      - 'package/boot/uboot-sunxi/patches/**'
      - 'target/linux/sunxi/**'
      - '.github/workflows/build-orangepi-zero3.yml'

env:
  TARGET: sunxi
  SUBTARGET: cortexa53
  DEVICE_PROFILE: xunlong_orangepi-zero3
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build Orange Pi Zero3 1.5GB Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # 6小时上限

    steps:
      # -----------------------------------------------------------------------
      # 1. 检出代码
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 2. 安装编译依赖
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get full-upgrade -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

      # -----------------------------------------------------------------------
      # 3. 释放磁盘空间（GitHub runner 空间有限）
      # -----------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          docker image prune -af 2>/dev/null || true
          df -h

      # -----------------------------------------------------------------------
      # 4. 缓存 dl/ 目录（下载的源码包）
      # -----------------------------------------------------------------------
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl/
          key: dl-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('feeds.conf.default') }}-${{ github.sha }}
          restore-keys: |
            dl-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('feeds.conf.default') }}-
            dl-${{ env.TARGET }}-${{ env.SUBTARGET }}-
            dl-${{ env.TARGET }}-

      # -----------------------------------------------------------------------
      # 5. 缓存工具链（首次编译后显著加速）
      # -----------------------------------------------------------------------
      - name: Cache toolchain
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/toolchain-*
            staging_dir/host
            build_dir/host
            build_dir/hostpkg
          key: toolchain-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('toolchain/**', 'include/toolchain*.mk') }}
          restore-keys: |
            toolchain-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      # -----------------------------------------------------------------------
      # 6. 克隆第三方包
      # -----------------------------------------------------------------------
      - name: Clone third-party packages
        run: |
          # OpenClash
          git clone --depth=1 -b dev \
            https://github.com/vernesong/OpenClash.git \
            package/third-party/openclash

      # -----------------------------------------------------------------------
      # 7. 更新并安装 feeds
      # -----------------------------------------------------------------------
      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      # -----------------------------------------------------------------------
      # 7. 生成编译配置
      # -----------------------------------------------------------------------
      - name: Generate .config
        run: |
          cat > .config << 'EOF'
          # ── 目标平台 ───────────────────────────────────────────────────
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y

          # ── LuCI Web 界面 ──────────────────────────────────────────────
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y

          # ── LuCI 扩展插件（可按需取消注释）───────────────────────────
          # CONFIG_PACKAGE_luci-app-ttyd=y          # Web 终端
          # CONFIG_PACKAGE_luci-app-statistics=y    # 流量统计图表
          # CONFIG_PACKAGE_luci-app-nlbwmon=y       # 带宽监控
          # CONFIG_PACKAGE_luci-app-samba4=y        # Samba 文件共享(NAS)
          # CONFIG_PACKAGE_luci-app-wireguard=y     # WireGuard VPN 界面

          # ── 中文支持 ───────────────────────────────────────────────────
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_default-settings=y
          CONFIG_PACKAGE_default-settings-chn=y    # 中文优化(时区/opkg源)

          # ── 系统工具 ───────────────────────────────────────────────────
          CONFIG_PACKAGE_autocore=y                 # CPU频率/温度显示
          CONFIG_PACKAGE_automount=y                # USB 自动挂载
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_openssh-sftp-server=y      # SFTP 支持
          # CONFIG_PACKAGE_coreutils=y              # GNU 工具集
          # CONFIG_PACKAGE_zsh=y                    # zsh shell
          # CONFIG_PACKAGE_lsof=y                   # 查看打开文件

          # ── 网络工具 ───────────────────────────────────────────────────
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_nftables=y
          # CONFIG_PACKAGE_wireguard-tools=y        # WireGuard VPN
          # CONFIG_PACKAGE_iw=y                     # WiFi 管理工具

          # ── OpenClash ─────────────────────────────────────────────────
          CONFIG_PACKAGE_luci-app-openclash=y
          # OpenClash 依赖
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_dnsmasq-full=y
          # dnsmasq-full 与默认 dnsmasq 冲突，必须禁用
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y

          # ── USB 存储支持（可按需取消注释）───────────────────────────
          # CONFIG_PACKAGE_kmod-usb-storage=y       # USB 存储驱动
          # CONFIG_PACKAGE_kmod-usb-storage-uas=y   # UAS 高速模式
          # CONFIG_PACKAGE_kmod-fs-ext4=y           # ext4 文件系统
          # CONFIG_PACKAGE_kmod-fs-ntfs3=y          # NTFS 文件系统
          # CONFIG_PACKAGE_e2fsprogs=y              # ext4 工具
          # CONFIG_PACKAGE_autosamba=y              # Samba 自动配置

          # ── Docker ────────────────────────────────────────────────────
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_docker-compose=y
          # Docker 依赖的内核模块
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-conntrack6=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-bridge=y
          CONFIG_PACKAGE_kmod-fs-overlayfs=y        # OverlayFS 存储驱动
          # Docker 依赖的用户态工具
          CONFIG_PACKAGE_cgroupfs-mount=y
          CONFIG_PACKAGE_kmod-crypto-sha256=y
          # 内核 cgroup 支持（defconfig 一般已启用，显式声明确保开启）
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_DEVICE=y
          CONFIG_KERNEL_CGROUP_MEMORY=y
          CONFIG_KERNEL_CGROUP_PIDS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_KERNEL_NET_NS=y
          CONFIG_KERNEL_PID_NS=y
          CONFIG_KERNEL_IPC_NS=y
          CONFIG_KERNEL_UTS_NS=y
          EOF
          make defconfig

      # -----------------------------------------------------------------------
      # 8. 下载编译依赖的源码包
      # -----------------------------------------------------------------------
      - name: Download package sources
        run: |
          make download -j8 V=s
          # 检查并删除损坏的下载文件（< 1KB）
          find dl/ -size -1024c -delete 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 9. 编译固件
      # -----------------------------------------------------------------------
      - name: Build firmware
        id: build
        run: |
          echo "::group::Compile (multi-thread)"
          make -j$(nproc) V=s || {
            echo "::endgroup::"
            echo "::group::Retry single-thread for error diagnosis"
            make -j1 V=s
            echo "::endgroup::"
          }
          echo "::endgroup::"
          echo "status=success" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 10. 整理固件文件
      # -----------------------------------------------------------------------
      - name: Collect firmware artifacts
        if: steps.build.outputs.status == 'success'
        run: |
          mkdir -p artifact/firmware
          cp -v bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.img.gz \
             artifact/firmware/ 2>/dev/null || true
          cp -v bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.manifest \
             artifact/firmware/ 2>/dev/null || true
          cp -v bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums \
             artifact/firmware/ 2>/dev/null || true
          echo "===== 固件列表 ====="
          ls -lh artifact/firmware/
          echo "===================="
          # 写入构建信息
          echo "Build date: $(date -u '+%Y-%m-%d %H:%M UTC')" > artifact/firmware/build-info.txt
          echo "Commit: ${{ github.sha }}" >> artifact/firmware/build-info.txt
          echo "Target: ${{ env.TARGET }}/${{ env.SUBTARGET }}" >> artifact/firmware/build-info.txt
          echo "Device: ${{ env.DEVICE_PROFILE }}" >> artifact/firmware/build-info.txt

      # -----------------------------------------------------------------------
      # 11. 上传固件为 Actions Artifact（备份，7天）
      # -----------------------------------------------------------------------
      - name: Upload firmware artifact
        if: steps.build.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE_PROFILE }}-${{ github.run_number }}
          path: artifact/firmware/
          retention-days: 7

      # -----------------------------------------------------------------------
      # 12. 上传 .config（方便复现，7天）
      # -----------------------------------------------------------------------
      - name: Upload .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ github.run_number }}
          path: .config
          retention-days: 7

      # -----------------------------------------------------------------------
      # 13. 发布 GitHub Release（永久公开下载链接）
      # -----------------------------------------------------------------------
      - name: Generate release tag
        if: steps.build.outputs.status == 'success'
        id: tag
        run: |
          echo "release_tag=orangepi-zero3-$(date -u '+%Y%m%d-%H%M')-r${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.build.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "Orange Pi Zero3 1.5GB | $(date -u '+%Y-%m-%d %H:%M UTC')"
          body: |
            ## ImmortalWrt - Orange Pi Zero3 1.5GB

            **构建信息**
            - 分支: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - 构建编号: #${{ github.run_number }}
            - 构建时间: `$(date -u '+%Y-%m-%d %H:%M UTC')`

            **固件说明**
            - 目标平台: `sunxi / cortexa53`
            - 设备型号: Xunlong Orange Pi Zero3
            - 已包含 1.5GB DRAM 修复补丁
            - 默认登录地址: http://192.168.1.1（用户名: root，无密码）

            **刷机方法**
            将 `.img.gz` 解压后用 `dd` 或 balenaEtcher 写入 TF 卡即可。
          files: artifact/firmware/*
          fail_on_unmatched_files: false
